<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>

  </header>

  <main>
    <section class="hero">
      <img src="images/image 1.png" alt="hero" class="hero__image">

      <p class="hero__art">ART OF THE ART</p>
      <div class="hero__content">
        <img src="images/logo.png" alt="logo" class="hero__logo">
      </div>

      <div class="card">
        <div class="card__img">
          <img src="images/1_1 Image.png" alt="card">
          <p class="card__new">NEW</p>
          <img src="images/Heart Button.svg" alt="fav" class="card__fav">
        </div>
        <div class="card__content">
          <div class="card__content__frame">
            <img src="images/Frame 48095644.png" alt="colors">
            <p>+7 colors</p>
          </div>
          <div>
            <p class="card__content__category">BRAND/CATEGORY</p>
            <P class="card__content__product">Product name</P>
          </div>
          <div class="card__content__rank">
            <img src="images/Small.png" alt="rank">
            <p>32</p>
          </div>
          <p class="card__content__price">$1199</p>
        </div>
      </div>
      <div class="card card__sm">
        <div class="card__img">
          <img src="images/1_1 Image.png" alt="card">
          <p class="card__new">NEW</p>
          <img src="images/Heart Button.svg" alt="fav" class="card__fav">
        </div>
        <div class="card__content">
          <div class="card__content__frame">
            <img src="images/Frame 48095644.png" alt="colors">
            <p>+7 colors</p>
          </div>
          <div>
            <p class="card__content__category">BRAND/CATEGORY</p>
            <P class="card__content__product">Product name</P>
          </div>
          <div class="card__content__rank">
            <img src="images/Small.png" alt="rank">
            <p>32</p>
          </div>
          <p class="card__content__price">$1199</p>
        </div>

      </div>


    </section>

  </main>

</body>

</html>
